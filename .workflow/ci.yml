# Layress CI 质量门禁（Gitee Go 流水线）
#
# 与 pre-commit 和 .github/workflows/ci.yml 共用 scripts/check-repo.mjs 的门禁链。
#
# 任务 5.1 起公共链含 check-build.mjs（前端构建 / 类型、Rust 编译与单测）。工具链缺失时脚本
# 明确失败且不提供跳过开关，因此本流水线必须自备与 GitHub 等价的前置，不能靠「文档门禁全绿」
# 掩盖编译未跑。两次云端回显（均为 Gitee 侧，GitHub Actions 用户回显通过）：
#   ① 2026-11-13 首次：缺 cargo / Rust 工具链，exit 255，见 evidence-index 5.1。
#   ② 2026-11-14 14:51 补齐工具链后：Node 与 pnpm 包都装成功，但 `pnpm -v` 报
#      "Failed to switch pnpm to v12.18.0 ... spawnSync Unknown system error -8"（ENOEXEC）。
#      原因是 Gitee 容器 PATH 里预装的 pnpm 10 抢在 npm 全局安装的 12.18.0 之前，
#      它按 package.json 的 packageManager pin 自切换受管版本，而生成的受管 shim 是
#      shebang-less 脚本，Node spawnSync 无法直接执行。GitHub 侧用 pnpm/action-setup@v4
#      直接提供 12.18.0，不走这条切换路径，所以不受影响。
#
# ⚠️ 沿用前置项目的两条 Gitee Go 实测教训（不是猜测）：
#   1. build@nodejs 插件对 nodeVersion 的支持清单不可靠，可能**静默跳过**自带 Node 安装，
#      容器里没有可用 node。因此 Node 由 commands 自行安装，nodeVersion 字段只当必填占位。
#   2. Gitee Go 的 commands **逐条执行、单条失败不短路** —— 分成多条命令会出现"前面红了整体还绿"。
#      所以全部前置与门禁用 && 链成一条命令，由最终退出码判败，杜绝假绿。
#
# 本轮修法（与本机 / GitHub 同构、可复查）：
#   - npm 全局安装 pnpm 12.18.0 后，把 npm prefix/bin 前置到 PATH，绕开容器预装的 pnpm 10；
#   - export npm_config_manage_package_manager_versions=false，关闭按 pin 自切换（即使命中
#     预装 pnpm 10 也不会再去 spawn 受管 shim）；本机隔离实跑：关闭前 pnpm 10 会切到 12.18.0，
#     关闭后原样返回 10.34.9，证明开关生效；
#   - `test "$(pnpm --version)" = "12.18.0"` 版本自证，版本不对立即红，不假绿（I16）；
#     公共链里的 check-build.mjs 也通过 PATH 解析 pnpm，所以必须修 PATH 而不只是换个调用名；
#   - rustup 改用 USTC 镜像的 rustup-init 二进制，不用 rsproxy 的 rustup-init.sh
#     （2026-11-11 本机实测该脚本 404，见 engineering.md）；crates 索引用 rsproxy sparse。
#
# 未实测（不能写成已通过）：Gitee 容器的 apt 权限、镜像与 crates 下载耗时、整条链的云端结果。
# 是否可用只认用户 push 后的下次回显；若该容器确实装不上 Linux WebView 依赖，
# 需显式决定 Gitee 侧的覆盖口径，不得默默给门禁加跳过开关。

version: '1.0'
name: ci-gates
displayName: CI 质量门禁

triggers:
  push:
    branches:
      precise:
        - main
  pr:
    branches:
      precise:
        - main

stages:
  - stage: gates
    displayName: 校验门禁
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: check_gates
        displayName: '洁净度 + 文档链接 + 双语 + 自测 + 构建/类型/单测'
        # 占位：插件可能不认识该版本并跳过其安装动作，真正的 Node 由下面命令自装
        nodeVersion: 20.19.0
        commands:
          # ① 自装 Node 20（npmmirror 镜像；curl/wget 二选一，解到 /usr/local 使 node 入 PATH）
          # ② 固定 pnpm 12.18.0 并做版本自证；关闭自管理版本切换，避免 pnpm 10 的 ENOEXEC。
          # ③ Rust stable 走 USTC 镜像二进制；source cargo env 后，check-build.mjs 才能找到 cargo。
          # ④ Linux WebView 系统依赖：容器已带 webkit2gtk-4.1 时跳过，否则尝试 apt（权限未实测，失败即明确红）。
          # 公共入口内部串行执行全部检查，任一步失败即返回非零；整条链只有一条 command，不短路。
          - >-
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            && export npm_config_manage_package_manager_versions=false
            && (curl -fsSL https://npmmirror.com/mirrors/node/v20.19.0/node-v20.19.0-linux-x64.tar.gz -o /tmp/node.tar.gz
            || wget -q https://npmmirror.com/mirrors/node/v20.19.0/node-v20.19.0-linux-x64.tar.gz -O /tmp/node.tar.gz)
            && tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1 && node -v
            && npm install -g pnpm@12.18.0
            && export PATH="$(npm config get prefix)/bin:$PATH" && hash -r
            && test "$(pnpm --version)" = "12.18.0"
            && curl -fsSL https://mirrors.ustc.edu.cn/rust-static/rustup/dist/x86_64-unknown-linux-gnu/rustup-init -o /tmp/rustup-init
            && chmod +x /tmp/rustup-init
            && RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static RUSTUP_UPDATE_ROOT=https://mirrors.ustc.edu.cn/rust-static/rustup /tmp/rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
            && . "$HOME/.cargo/env" && cargo --version
            && printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > "$HOME/.cargo/config.toml"
            && (pkg-config --exists webkit2gtk-4.1 || (apt-get update && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev))
            && pnpm install --frozen-lockfile
            && node scripts/check-repo.mjs --all
