<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layress</title>
    <style>
      /* 工具条独立条带：高度必须与 Rust 侧 TOOLBAR_H=96 一致，内容不得溢出（否则会被页面区域盖住）。
         预览态时工具 WebView 被铺满整个窗口，#preview 从 96px 起覆盖其余工作区。 */
      html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; background: #fff; }
      #bar {
        height: 96px;
        box-sizing: border-box;
        padding: 5px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
        background: #eef1f3;
        border-bottom: 1px solid #cfd8dc;
      }
      .row { display: flex; align-items: center; gap: 6px; height: 26px; min-height: 26px; }
      input[type="text"] { font-size: 13px; padding: 2px 8px; box-sizing: border-box; height: 26px; }
      button { font-size: 13px; padding: 2px 10px; white-space: nowrap; height: 26px; }
      button.active { background: #37474f; color: #fff; }
      #url-input { flex: 1; min-width: 0; }
      .num { width: 64px; }
      #slow-wrap { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; white-space: nowrap; color: #455a64; }
      #slow-wrap input { margin: 0; }
      /* 工具层脚本版本徽标：只有当前 main.ts 启动成功才会被写成 v... ；
         显示「加载中」或整个不出现 ⇒ 窗口仍是旧 HTML / 旧 JS，复验结论一律作废。 */
      #build-tag { margin-left: auto; font-size: 11px; white-space: nowrap; color: #78909c; font-variant-numeric: tabular-nums; }
      #build-tag.stale { color: #b71c1c; font-weight: 600; }
      .status { font-size: 12px; line-height: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status-line { color: #37474f; flex: 1 1 0; min-width: 0; }
      #viewport-line { color: #546e7a; flex: 0 1 auto; }
      #request-line { color: #b71c1c; flex: 0 1 auto; }
      /* 采集结果条已移到窗口最底部的独立状态栏 WebView（status.html），
         不再占用工具层 DOM：工具层 CSS 视口只有 64px，任何浮层都会遮住工具栏。 */

      /* 原地静态预览：与被测页面共用同一块工作区，不新开窗口；
         bottom 留出状态栏的 28px（对应 Rust STATUS_H=42 逻辑 px）。 */
      #preview { display: none; position: fixed; inset: 96px 0 28px 0; z-index: 10;
        background: #fff; flex-direction: column; font-size: 12px; color: #37474f; }
      #preview.show { display: flex; }
      #preview-head, #preview-foot { flex: none; box-sizing: border-box; padding: 6px 10px;
        border-bottom: 1px solid #cfd8dc; background: #f5f7f8; }
      #preview-head { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow: hidden; }
      #preview-head .spacer { flex: 1; }
      #preview-head .hint { color: #607d8b; white-space: nowrap; }
      #preview-check { white-space: nowrap; color: #2e7d32; }
      #preview-check.bad { color: #b71c1c; }
      #preview-stage { flex: 1; min-height: 0; overflow: auto; background: #eceff1;
        display: flex; align-items: flex-start; justify-content: flex-start; padding: 12px; box-sizing: border-box; }
      #preview-canvas { position: relative; flex: none; background: #fff;
        box-shadow: 0 0 0 1px #90a4ae; cursor: crosshair; }
      #preview-img { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
      #rect-anchor, #rect-temp { display: none; position: absolute; pointer-events: none; box-sizing: border-box; }
      #rect-anchor.show, #rect-temp.show { display: block; }
      #rect-anchor { border: 2px dashed #1565c0; background: rgba(21,101,192,.10); }
      #rect-temp { border: 2px solid #c62828; background: rgba(198,40,40,.12); }
      #preview-foot { border-bottom: none; border-top: 1px solid #cfd8dc; line-height: 1.6; }
      #capture-meta, #data-root-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #coord-info { color: #455a64; font-variant-numeric: tabular-nums; }
      .warn { color: #b71c1c; }
      /* 任务 1.1 项目设置：与静态预览同构的铺满工作区（0.1 已实机验证可行）。
         常态工具层 CSS 视口只有 64px，第三行会被裁，表单绝不放工具条内。 */
      #settings { display: none; position: fixed; inset: 96px 0 28px 0; z-index: 20;
        background: #fff; flex-direction: column; gap: 10px; padding: 16px;
        box-sizing: border-box; overflow: auto; font-size: 13px; color: #37474f; }
      #settings.show { display: flex; }
      #settings h2 { margin: 0; font-size: 15px; }
      #settings .hint { color: #607d8b; font-size: 12px; }
      #settings label { display: block; margin-bottom: 4px; }
      #settings input[type="text"], #settings select { font-size: 13px; padding: 4px 8px;
        width: 320px; max-width: 100%; box-sizing: border-box; }
      #settings .actions { display: flex; gap: 8px; align-items: center; }
      #settings-rebuild.danger { color: #fff; background: #c62828; border-color: #c62828; }
      #settings-viewport .viewport-row { display: flex; gap: 6px; align-items: center; }
      #settings-viewport input[type="number"] { width: 88px; font-size: 13px; padding: 4px 6px;
        box-sizing: border-box; }
      .last-loaded { font-size: 12px; color: #455a64; word-break: break-all; line-height: 1.6; }
      /* 任务 2.1 项目列表：条目可点选进编辑；活动项目实心圆点标示 */
      .project-item { padding: 4px 6px; border-radius: 4px; cursor: pointer; line-height: 1.6;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .project-item:hover { background: #eceff1; }
      .project-item.active { background: #e8f0fe; color: #1565c0; }
      /* 任务 3.1：条目内「切换」按钮；两段确认后先持久提交再重建被测页 */
      .project-item .switch-btn { font-size: 12px; height: 22px; padding: 0 8px; margin-left: 8px; }
      .project-item .switch-btn.armed { color: #fff; background: #c62828; border-color: #c62828; }
      #settings-list { border-top: 1px solid #cfd8dc; padding-top: 10px; line-height: 1.7; }
      #btn-settings { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body>
    <div id="bar">
      <div class="row">
        <input id="url-input" type="text" placeholder="输入 http(s) 地址" />
        <button id="btn-go" type="button">前往</button>
        <button id="btn-refresh" type="button">刷新</button>
        <button id="btn-sample" type="button">打开样例页</button>
        <button id="btn-settings" type="button">项目：无</button>
      </div>
      <div class="row">
        <label for="width-input">宽</label>
        <input id="width-input" class="num" type="text" placeholder="宽" />
        <label for="height-input">高</label>
        <input id="height-input" class="num" type="text" placeholder="高" />
        <button id="btn-size" type="button">应用尺寸</button>
        <button id="btn-capture" type="button">采集</button>
        <button id="btn-cancel" type="button">取消</button>
        <span id="slow-wrap" title="开发期复验用：勾选后采集在拿到截图后额外等待 5 秒，期间点「刷新」/「取消」/ 再次「采集」可验证本次结果失效且不写盘。仅开发构建生效">
          <input id="slow-capture" type="checkbox" /><label for="slow-capture">慢采 5s</label>
        </span>
        <span id="build-tag" class="stale" data-build="v20261118-4"
          title="工具层脚本版本：显示 v... 才说明窗口加载的是当前代码；红色「加载中」或不出现 ⇒ 旧窗口，复验作废">加载中…</span>
      </div>
      <div class="row">
        <span id="status-line" class="status"></span>
        <span id="viewport-line" class="status"></span>
        <span id="request-line" class="status"></span>
      </div>
    </div>

    <div id="preview">
      <div id="preview-head">
        <strong>已记录画面 · 静态预览</strong>
        <span class="hint">不是业务暂停，页面脚本可能继续运行</span>
        <button id="btn-mode-original" type="button">原始比例</button>
        <button id="btn-mode-fit" type="button">适应区域</button>
        <button id="btn-anchor" type="button">对齐参照块</button>
        <button id="btn-recapture" type="button">重新采集</button>
        <span class="spacer"></span>
        <span id="preview-check"></span>
        <button id="btn-preview-back" type="button">返回页面</button>
      </div>
      <div id="preview-stage">
        <div id="preview-canvas">
          <img id="preview-img" alt="当前采集的静态画面" draggable="false" />
          <div id="rect-anchor"></div>
          <div id="rect-temp"></div>
        </div>
      </div>
      <div id="preview-foot">
        <div id="capture-meta"></div>
        <div id="coord-info"></div>
        <div id="data-root-line"></div>
      </div>
    </div>

    <div id="settings">
      <h2>项目设置</h2>
      <span class="hint">工具层铺满工作区，被测页面暂移出可视区但尺寸不变；保存成功后才更新项目状态。</span>
      <div id="settings-state"></div>
      <div>
        <label for="settings-name">项目名称（去首尾空白后 1–80 字符）</label>
        <input id="settings-name" type="text" placeholder="例如：本地后台" />
      </div>
      <div>
        <label for="settings-url">起始地址（仅 http / https）</label>
        <input id="settings-url" type="text" placeholder="https://example.com" />
      </div>
      <div>
        <label for="settings-preset">视口预设（通用尺寸，非真机模拟）</label>
        <select id="settings-preset">
          <option value="desktop">桌面 1280×800</option>
          <option value="tablet">平板 768×1024</option>
          <option value="phone">手机 390×844</option>
        </select>
      </div>
      <div id="settings-viewport" hidden>
        <label>视口（随「保存修改」一并提交；旋转立即生效；非真机模拟）</label>
        <div class="viewport-row">
          <input id="settings-vp-w" type="number" min="16" max="4096" step="1" placeholder="宽" />
          <span>×</span>
          <input id="settings-vp-h" type="number" min="16" max="4096" step="1" placeholder="高" />
          <button id="settings-vp-rotate" type="button" title="立即保存并应用：交换宽高，保留预设身份；方形不变">旋转</button>
        </div>
      </div>
      <div id="settings-last-loaded" hidden>
        <label>最近地址（事实记忆：仅主文档完成加载；SPA history / hash 变化不追踪）</label>
        <div id="settings-last-loaded-value" class="last-loaded"></div>
        <button id="settings-open-start" type="button" hidden
          title="显式导航到该项目起始地址；完成加载后自动记忆最近地址">打开起始地址</button>
      </div>
      <div class="actions">
        <button id="settings-save" type="button">新建项目并保存</button>
        <button id="settings-new" type="button" hidden title="退出编辑模式，回到新建表单；未保存的修改即取消">新建</button>
        <button id="settings-cancel" type="button">关闭</button>
        <button id="settings-retry" type="button" hidden
          title="重新打开当前活动项目的页面：先应用视口再导航（最近地址优先，为空回退起始地址）。用于启动恢复 / 切换后页面打开失败的显式重试">重试打开当前项目</button>
        <button id="settings-retry-save" type="button" hidden
          title="配置已应用但未保存时，按当前 revision 重新提交未写盘的最近地址；不导航、不改运行条件">重试保存</button>
        <button id="settings-rebuild" type="button" hidden
          title="备份原始配置文件后清空项目记忆；截图不受影响">备份并重建空配置</button>
      </div>
      <div id="settings-list"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
