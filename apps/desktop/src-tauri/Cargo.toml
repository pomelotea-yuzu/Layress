[package]
name = "layress-desktop"
version = "0.1.0"
description = "Layress 桌面工作台"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "layress_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：单窗口多 WebView（Window::add_child / WebviewBuilder）所需，见 design.md
tauri = { version = "2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS 原生快照：经 tauri::Webview::with_webview 取得 WKWebView 指针，
# 用 takeSnapshotWithConfiguration:completionHandler: 只截被测视图（E05）。
# 版本与 wry 0.57.2 的间接依赖对齐；非 macOS 平台不编译这段，也不静默换成整屏截图。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
