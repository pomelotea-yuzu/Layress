[package]
name = "layress-desktop"
version = "0.1.0"
description = "Layress 桌面工作台"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "layress_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：单窗口多 WebView（Window::add_child / WebviewBuilder）所需，见 design.md
tauri = { version = "2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
