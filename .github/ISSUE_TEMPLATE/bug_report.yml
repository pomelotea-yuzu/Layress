name: Bug report / Bug 报告
description: Report a task, annotation, integration or verification problem / 报告任务、圈画、接入或复查问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and redact private page content, screenshots, paths and credentials.
        Report credential leaks, unintended outbound data or system-user-directory writes privately per SECURITY.md.
        请先搜索已有 issue，并对页面内容、截图、路径与凭据脱敏。
        涉及凭据泄露、未授权外发或默认写系统用户目录的问题，按 SECURITY.md 私下报告。
  - type: textarea
    id: problem
    attributes:
      label: What happened / 遇到的问题
      description: Describe the failed step and its impact / 描述哪个步骤出了什么问题、影响是什么
      placeholder: |
        e.g. The annotation moved after resizing the captured image.
        例：缩放采集画面后，圈画位置错位。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / 期望行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include only steps you ran; mark missing information as unknown / 只写实际跑过的步骤，缺失信息写 unknown
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Relevant scene conditions (if applicable) / 相关现场条件（如适用）
      description: Include URL shape, viewport, state, scaling and locale when relevant; never invent missing values / 按相关性提供 URL 形态、视口、状态、缩放和语言，不猜补缺失信息
  - type: dropdown
    id: target
    attributes:
      label: Affected workflow / 受影响的流程
      options:
        - Scene capture and annotation / 现场采集与圈画
        - Tasks and agent handoff / 任务与 Agent 交接
        - Rechecks and results / 复查与结果
        - Installation or connection / 安装或连接
        - Documentation or other / 文档或其他
  - type: textarea
    id: env
    attributes:
      label: Version and environment / 版本与环境
      value: |
        - Layress version or commit / 版本或提交：
        - OS and browser / 操作系统与浏览器：
        - Agent client and version, if applicable / Agent 客户端与版本（如适用）：
        - Node version / Node 版本：
        - Data directory used / 实际数据目录：
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshot (optional) / 脱敏日志或截图（可选）
      description: Share only the minimum region or error shape; no full data directory or private DOM / 只附必要区域或报错形态，不上传整个数据目录或私有 DOM
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations / 确认项
      options:
        - label: Searched existing issues / 已搜索已有 issue
          required: true
        - label: Redacted credentials and private page material / 已对凭据和页面隐私资料脱敏
          required: true
