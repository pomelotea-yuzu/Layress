name: Feature request / 功能建议
description: Propose a simpler workflow or a useful capability / 提议更简单的流程或有用的能力
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Layress is a local UI acceptance assistant. The confirmed direction and stage index are in
        docs/product/product.md and docs/product/roadmap.md. Explain the everyday task and existing alternative;
        do not assume that old stress-testing modules or platform commitments are current requirements.
        Layress 是本地界面验收助手，现行依据见产品文档与路线图。请描述日常任务和已有解法，
        不默认恢复旧压力测试模块或平台承诺。
  - type: dropdown
    id: category
    attributes:
      label: Which workflow does this improve? / 改善哪段流程
      options:
        - Scene capture and annotation / 现场采集与圈画
        - Tasks and agent handoff / 任务与 Agent 交接
        - Rechecks and reusable checks / 复查与可复用检查
        - Installation or connection / 安装或连接
        - Evidence and collaboration / 证据与协作
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Who does this task, when, and what do they do today? / 谁在什么时候做这件事，目前怎样完成
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience / 建议体验
      description: Describe the desired result; detailed technical designs are optional / 描述希望得到的结果，无需先写完整技术方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives / 已有解法
  - type: textarea
    id: scope
    attributes:
      label: Scope and data flow / 范围与数据流
      description: Mention platform, client, external service, cost or storage requirements if known / 如已知，请说明平台、客户端、外部服务、费用和存储要求
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations / 确认项
      options:
        - label: Read the current product requirements and roadmap / 已读当前产品依据与路线图
          required: true
        - label: Searched existing issues and discussions / 已搜索已有 issue 与讨论
          required: true
