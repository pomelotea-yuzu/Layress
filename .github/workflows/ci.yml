name: CI

# 校验逻辑的唯一事实源是仓库脚本，本流水线只做「装工具链 + 调用脚本」，不另写一套判据。
# 与 pre-commit 共用 scripts/check-repo.mjs 的门禁链（含 check-build.mjs 的构建 / 类型 / 单测）。
# 平台适用范围：ubuntu-latest 与本机 macOS arm64 跑同一条命令链；Windows 未验证（见 evidence-index E12）。
# CI 侧首次运行回显需用户 push 后取得，不把「配置已写」冒充「云端已通过」。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebView build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository gates (hygiene / links / bilingual / build / typecheck / tests / selftests)
        run: node scripts/check-repo.mjs --all
