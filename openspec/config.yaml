schema: spec-driven

context: |
  项目：Layress — 面向个人开发者和小团队的本地界面验收助手。
  当前依据：docs/product/product.md（D22 / D25）与 docs/product/roadmap.md（D23，正式六阶段索引）。
  当前首版形态：Tauri 桌面工作台 + 共用任务核心 + CLI（2026-11-10 用户决定，D25）。
  在同一主窗口操作页面、配置设备和原地反馈；此前 Web 工作台与 Electron 候选不再是当前方案，MCP 按实际需要增加。
  用户希望人和 Agent 都简单使用：人从现场圈画和短描述开始，Agent 获得同一任务、位置、证据与复查结果。
  不强制用户先写选择器、JSON 或正式用例；交互细节和具体接入方式尚未实现。

  当前阶段（2026-11-11）：add-tauri-page-host 任务 1.x 与 2.1/2.3/2.4 完成并经用户人工复验——单窗口双 WebView（互不重叠布局、被测层零能力）、HTTP(S) 导航 + 可达性预检、视口设定与 title 哨兵测量、视口边界细边框（工具标记，采集前须关闭）、新窗口 / 下载 / 权限明确拒绝、内嵌本地样例服务；2.2 的无效地址负例人工未测不勾选；采集（3.x）、存储与权限验证（4.x）未开始。
  活动入口：openspec/changes/add-tauri-page-host/proposal.md；只覆盖阶段 1 首增量的单窗口页面承载、基础视口、截图与原地预览可行性，其余范围不自动获批。
  当前提交状态：用户已明确本地提交；另一 Agent 的 review 已收到，原编写 Agent 已处理意见，本轮同步最终审阅流程并在必要检查通过后提交，不开始产品编码。
  阶段 1 提案：docs/product/2026-11-10-stage-one-plan.md；Tauri 已确定，项目 / 设备记忆、持久反馈与补拍留后续增量，阶段 2 保留 Agent 自动交接与处理闭环。
  用户要求检验竞争力：圈画、快捷反馈、设备预览和反馈闭环本身已有先例，不据此声称差异化；核查见 docs/research/2026-11-10-integrated-review-differentiation.md。
  旧阶段封存见 docs/research/2026-11-09-phase-closure.md；旧资料可查，不自动恢复旧闸门、四模块架构、缩减算法、实验规模或三端桌面发行承诺。

  已确认的产品与工程边界：
  - UI 与 CLI 共享任务事实、证据和复查结果；Agent 不必操作工作台按钮才能使用能力。
  - 用户原话、实际观测、自动检查候选和 Agent 建议保留来源；不能猜造缺失现场、定位器、源码路径或检查结果。
  - 圈画位置绑定原始画面和采集条件；页面更新后的新现场不覆盖原反馈现场，不默认旧位置仍有效。
  - 基础流程需选择设备并记住上次选择；浏览器设备模拟与真机验证分开，采集现场保留当次实际配置。
  - 缺陷候选与确认结果分开；可点击不等于业务成功；Agent 声称修好不自动等于验收完成。
  - 执行成功、检查通过、失败、未执行和不确定分别表达；机器通过不替代未执行的人工复核。
  - 任务、截图、页面资料默认本地保存；交给远程 Agent / 模型时说明数据流和成本，不静默外发或增加付费调用。
  - 产品数据、日志、缓存、临时文件留在产品目录下的数据根（默认 .layress/）或用户明确指定的目录；不得默认写系统用户目录。
  - 数据根解析结果与可写性可见；不可写时明确报错，不回落系统用户目录；安装不提权、不改系统 PATH。
  - 浏览器运行期目录也需纳入数据根；使用本机既有开发工具不代表产品已经满足便携写盘要求。
  - Tauri 与系统 WebView 的应用数据、会话、缓存和临时目录也须纳入便携存储验证，不能直接沿用系统用户目录默认值。
  - Windows WebView2、macOS WKWebView、Linux WebKitGTK 的引擎与控制能力不同；实际引擎和可用的模拟条件要显示，不能把截图和设备预设等同真机或跨浏览器验证。
  - 一次性产物只去 artifacts/；运行时资料只去 .layress/；二者不入库，手写结论进 docs/ 对应位置。

  Agent 接口约定（目标要求，尚未实现）：
  - 可通过非交互 CLI 发现能力、取得任务与证据、提交处理结果、发起范围明确的复查。
  - 提供有版本的结构化输入输出、稳定任务标识、退出码和错误码；机器结果走 stdout，进度与诊断走 stderr。
  - 缺参明确报错退出，不悬挂等待 TTY；超时、取消和部分完成范围可见，释放本次资源。
  - 连接现有 Agent 必须验证具体方式，不假定能向任意运行中的聊天会话推送消息。
  - 读取证据、查看旧现场、真实重跑与会改变被测项目的操作分开；后者遵守具体授权范围，不因非交互调用而自动授权。
  - 具体命令、字段、状态机、支持的宿主及验收测试写在实现 change，不提前宣称已兼容。

  环境与未定技术选择：
  - 开发环境 macOS arm64 / zsh / Node ≥ 20，当前会话可使用独立 Node；CI runner 为 Ubuntu。
  - 共享开发工具 OpenSpec 1.17.0 另要求 Node >= 22.12.0，本机 Node 26.13.0 已运行通过。入口和隔离目录约定见 docs/development/workflow.md，工具不随产品打包、不装进本仓，也不改系统 PATH。
  - 桌面载体采用 Tauri；Rust 原生层与 TypeScript strict 前端配合，前端使用 pnpm。workspace 与依赖版本已定稿（见 change design「实施定稿」）；UI 框架暂不引入，核心与 CLI 的语言边界由后续实现设计定稿。
  - 优先验证系统 WebView 的页面承载、视口、截图、批注和权限隔离，不默认附带 Chromium 或 Node.js；若另需浏览器或运行时，先写清用途、总分发体积与写盘范围，不静默改变载体。
  - 已读取 API：多 WebView 的 Window::add_child 目前要求 unstable 功能；macOS WKWebView 不支持 data_directory，自定义 data store identifier 不等于可指定目录。首个 change 单列非持久会话及真实写盘验证，不以 API 设置成功冒充便携通过。
  - 优先复用成熟浏览器、批注与检查能力；Playwright / CDP 等尚未选定为产品接入实现。
  - 本地与 CI 共用 node scripts/check-repo.mjs 公共门禁；构建、类型、业务测试、lint、spec 检查待产品骨架建立后接入同一条链。
  - MIT；产出默认中文，根目录登记的对外文档同轮同步英文，产品文案按 i18n/ 口径演进。
  - 编写 Agent 写完 change 后等待用户切换另一 Agent，在对应目录产出 review.md；用户回原编写 Agent 后，由其读取并处理意见、通过必要检查，即可本地提交，无需再次确认。不得以编写者自审、空占位或机器 PASS 跳过流程；用户负责切换，不要求自动生成子 Agent。机器审阅不替代人工验收。
  - 实际远程名以 git remote -v 为准；本地提交遵守 Agent 审阅前置条件，push 与 tag 归用户，远程同步状态只认实时命令。

conventions:
  language: 默认中文；仅 i18n/docs-manifest.json 的 docs 登记文件同轮维护英文，内部文档无需成对
  naming:
    specs: openspec/specs/<capability>/spec.md
    changes: openspec/changes/<verb-led-kebab-name>/
    archive: openspec/changes/archive/<YYYY-MM-DD>-<change-name>/
    docs: 现行已批准规则用 english-kebab-case.md；讨论与当次记录用 YYYY-MM-DD-english-kebab-case.md；路线图只作阶段和设计入口索引
  evidence:
    live-probes: 具体设计、任务和证据按 change 归属；截图默认本地，不提交真实被测页面资料
    honesty: 未执行项如实单列，不把机器通过或 Agent 声称完成写成人工验收通过
  authority: 源码 > changes/archive/ > specs/ > docs/ > AGENTS.md
