schema: spec-driven

context: |
  项目：Layress — 面向个人开发者和小团队的本地界面验收助手。
  当前依据：docs/product/product.md（D22）与 docs/product/roadmap.md（D23，正式六阶段索引）。
  首版形态：本地服务 + Web 工作台 + 共用任务核心 + CLI。MCP 与桌面壳由实际需求驱动，非首版前提。
  用户希望人和 Agent 都简单使用：人从现场圈画和短描述开始，Agent 获得同一任务、位置、证据与复查结果。
  不强制用户先写选择器、JSON 或正式用例；交互细节和具体接入方式尚未实现。

  当前阶段（2026-11-10）：路线图已敲定，阶段 1 细分设计讨论中，尚未开始实现。
  当前仅讨论与文档整理，不装依赖、不建 workspace、不立技术 change、不 push。
  阶段 1 讨论稿：docs/product/2026-11-10-stage-one-experience-and-access.md；具体接入方案未定，阶段 2 后续讨论。
  旧阶段封存见 docs/research/2026-11-09-phase-closure.md；旧资料可查，不自动恢复旧闸门、四模块架构、缩减算法、实验规模或三端桌面发行承诺。

  已确认的产品与工程边界：
  - UI 与 CLI 共享任务事实、证据和复查结果；Agent 不必操作工作台按钮才能使用能力。
  - 用户原话、实际观测、自动检查候选和 Agent 建议保留来源；不能猜造缺失现场、定位器、源码路径或检查结果。
  - 圈画位置绑定原始画面和采集条件；页面更新后的新现场不覆盖原反馈现场，不默认旧位置仍有效。
  - 基础流程需选择设备并记住上次选择；浏览器设备模拟与真机验证分开，采集现场保留当次实际配置。
  - 缺陷候选与确认结果分开；可点击不等于业务成功；Agent 声称修好不自动等于验收完成。
  - 执行成功、检查通过、失败、未执行和不确定分别表达；机器通过不替代未执行的人工复核。
  - 任务、截图、页面资料默认本地保存；交给远程 Agent / 模型时说明数据流和成本，不静默外发或增加付费调用。
  - 产品数据、日志、缓存、临时文件留在产品目录下的数据根（默认 .layress/）或用户明确指定的目录；不得默认写系统用户目录。
  - 数据根解析结果与可写性可见；不可写时明确报错，不回落系统用户目录；安装不提权、不改系统 PATH。
  - 浏览器运行期目录也需纳入数据根；使用本机既有开发工具不代表产品已经满足便携写盘要求。
  - 一次性产物只去 artifacts/；运行时资料只去 .layress/；二者不入库，手写结论进 docs/ 对应位置。

  Agent 接口约定（目标要求，尚未实现）：
  - 可通过非交互 CLI 发现能力、取得任务与证据、提交处理结果、发起范围明确的复查。
  - 提供有版本的结构化输入输出、稳定任务标识、退出码和错误码；机器结果走 stdout，进度与诊断走 stderr。
  - 缺参明确报错退出，不悬挂等待 TTY；超时、取消和部分完成范围可见，释放本次资源。
  - 连接现有 Agent 必须验证具体方式，不假定能向任意运行中的聊天会话推送消息。
  - 读取证据、查看旧现场、真实重跑与会改变被测项目的操作分开；后者遵守具体授权范围，不因非交互调用而自动授权。
  - 具体命令、字段、状态机、支持的宿主及验收测试写在实现 change，不提前宣称已兼容。

  环境与未定技术选择：
  - 开发环境 macOS arm64 / zsh / Node ≥ 20，当前会话可使用独立 Node；CI runner 为 Ubuntu。
  - TypeScript strict 与 pnpm 是后续工程规划，workspace、包划分、Web 框架及浏览器接入由阶段设计与依赖清单定稿。
  - 优先复用成熟浏览器、批注与检查能力；Playwright / CDP 等尚未选定为产品接入实现。
  - 本地与 CI 共用 node scripts/check-repo.mjs 公共门禁；构建、类型、业务测试、lint、spec 检查待产品骨架建立后接入同一条链。
  - MIT；产出默认中文，根目录登记的对外文档同轮同步英文，产品文案按 i18n/ 口径演进。
  - 实际远程名以 git remote -v 为准；本地提交可以做，push 与 tag 归用户，远程同步状态只认实时命令。

conventions:
  language: 默认中文；仅 i18n/docs-manifest.json 的 docs 登记文件同轮维护英文，内部文档无需成对
  naming:
    specs: openspec/specs/<capability>/spec.md
    changes: openspec/changes/<verb-led-kebab-name>/
    archive: openspec/changes/archive/<YYYY-MM-DD>-<change-name>/
    docs: 现行已批准规则用 english-kebab-case.md；讨论与当次记录用 YYYY-MM-DD-english-kebab-case.md；路线图只作阶段和设计入口索引
  evidence:
    live-probes: 具体设计、任务和证据按 change 归属；截图默认本地，不提交真实被测页面资料
    honesty: 未执行项如实单列，不把机器通过或 Agent 声称完成写成人工验收通过
  authority: 源码 > changes/archive/ > specs/ > docs/ > AGENTS.md
